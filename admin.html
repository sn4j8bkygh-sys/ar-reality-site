<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ — Reality</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#101114;color:#f4f5f7;font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:900px;margin:auto}section{background:#1a1c21;border:1px solid #30333b;border-radius:18px;padding:20px;margin:16px 0}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #414550;margin:5px 0;width:100%}input{background:#101114;color:white}button{background:#d9ff70;color:#101114;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}figure{margin:0;background:#101114;padding:8px;border-radius:12px}img{width:100%;height:220px;object-fit:contain}small{color:#aeb3bf}a{color:#d9ff70}
</style></head><body><main><h1>Закрытая галерея</h1><p><small>Только для владельца сайта. Вход требует аккаунта Supabase, добавленного в список администраторов.</small></p>
<section><h2>Вход администратора</h2><form id="login"><input id="email" type="email" placeholder="Адрес электронной почты" required><input id="password" type="password" placeholder="Пароль" required><button>Войти</button></form><button id="logout" hidden>Выйти</button><p id="status" aria-live="polite"></p></section>
<section><h2>Фотографии посетителей</h2><button id="refresh">Обновить галерею</button><div class="grid" id="gallery"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=4"></script><script>
const cfg=window.SITE_CONFIG||{},configured=cfg.SUPABASE_URL&&!cfg.SUPABASE_URL.includes('YOUR_')&&cfg.SUPABASE_ANON_KEY&&!cfg.SUPABASE_ANON_KEY.includes('YOUR_');
const client=configured?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;
const status=document.getElementById('status'),gallery=document.getElementById('gallery'),logout=document.getElementById('logout');
if(!client){status.textContent='Сначала заполни config.js по README.';}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});status.textContent=error?'Не удалось войти. Проверь аккаунт администратора.':'Вход выполнен.';logout.hidden=!!error;if(!error)loadPhotos();});
logout.addEventListener('click',async()=>{await client?.auth.signOut();gallery.replaceChildren();logout.hidden=true;status.textContent='Вы вышли.';});
document.getElementById('refresh').addEventListener('click',loadPhotos);
async function loadPhotos(){if(!client)return;const {data:{user}}=await client.auth.getUser();if(!user){status.textContent='Сначала войди.';return;}status.textContent='Загружаем…';gallery.replaceChildren();const {data,error}=await client.storage.from('visitor-photos').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});if(error){status.textContent='Нет доступа к галерее. Проверь SQL-политики из README.';return;}for(const f of data||[]){if(!f.name||f.name.startsWith('.'))continue;const {data:signed,error:se}=await client.storage.from('visitor-photos').createSignedUrl(f.name,300);if(se||!signed)continue;const fig=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('small');img.src=signed.signedUrl;img.alt='Фото посетителя';cap.textContent=new Date(f.created_at||Date.now()).toLocaleString();fig.append(img,cap);gallery.append(fig);}status.textContent=`Найдено фото: ${gallery.children.length}`;}
</script></body></html>
